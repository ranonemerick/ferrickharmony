services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=ferrick-harmony'
      - 'POSTGRES_PASSWORD=${FH_POSTGRES_PASSWORD:-postgres}'
      - 'POSTGRES_USER=${FH_POSTGRES_USER:-postgres}'
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: