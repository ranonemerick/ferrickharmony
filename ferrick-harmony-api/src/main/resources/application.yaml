server:
  port: 8080

spring:
  application:
    name: ferrick-harmony-api

  docker:
    compose:
      enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5433/ferrick-harmony
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  messages:
    basename: i18n/messages
    encoding: UTF-8

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

broker:
  queue:
    email:
      name: appointment.email.queue
  exchange:
    appointment:
      name: appointment.exchange
  routing-key:
    email:
      name: appointment.email.routingKey

token:
  jwt:
    secret: ${JWT_SECRET:secret}