server:
  port: 8081

spring:
  application:
    name: ferrick-harmony-notification

  datasource:
    url: jdbc:postgresql://localhost:5434/ferrick-harmony-notification
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  flyway:
    enabled: true

broker:
  queue:
    email:
      name: appointment.email.queue
  exchange:
    appointment:
      name: appointment.exchange
  routing-key:
    email:
      name: appointment.email.routingKey